name: validate

# Validate every push and pull request; deploy main to Cloudflare Pages.
#
# Unlike the course template this repository was created from, there is no
# release gate here and no auth worker: this site is public and everything on
# it is meant to be read. Pushing to main IS publishing.
#
# The rule this enforces: whatever is on main must render, every shell example
# on it must actually run, and every link must resolve.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          # Fails the build if pixi.lock is out of date with pixi.toml,
          # which is what keeps the environment genuinely reproducible.
          locked: true
          cache: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Lint
        run: pixi run lint

      # The point of the whole repository: the commands we tell people to run
      # are extracted from the pages and executed. A broken example here is a
      # broken example for every reader.
      #
      # This runs on ubuntu, which is the platform the material targets --
      # including for Windows readers, who are told to use WSL2.
      - name: Test every shell example
        run: pixi run test

      - name: Render site
        run: pixi run site

      - name: Check internal links
        run: pixi run check-links

      # Instructor drops and raw source files. instructor/ is gitignored here
      # (see instructor/README.md), so this is a second line of defence rather
      # than the first -- but a public site earns both.
      - name: Check published output
        run: pixi run check-output

      # v6+ runs on Node 24; v4 triggered the Node 20 deprecation warning.
      # Must stay in the same generation as download-artifact in the deploy
      # job below -- the artifact format is shared between them.
      - name: Upload rendered site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          retention-days: 14

  deploy:
    needs: validate
    # Only main, and never from a pull request -- a PR from a fork must not be
    # able to publish, nor to read the Cloudflare token.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Deploy exactly the bytes that were validated, rather than re-rendering
      # and hoping the second render matches the first.
      #
      # No checkout step: unlike the course template, nothing from the repo is
      # needed at deploy time. The template checked out in order to copy the
      # auth worker into _site/, and this site has no worker.
      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: _site

      # Fail with a readable message rather than a confusing wrangler error.
      - name: Check deploy configuration
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$PROJECT" ] || missing="$missing vars.CLOUDFLARE_PROJECT_NAME"
          [ -n "$TOKEN" ]   || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository configuration:$missing"
            echo "See the Cloudflare section of README.md."
            exit 1
          fi
          echo "OK: deploy configuration present"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy _site
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=main
