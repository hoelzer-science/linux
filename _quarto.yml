project:
  type: website
  output-dir: _site

  # Render ONLY .qmd, and only from the places content actually lives.
  #
  # A Quarto *website* project otherwise turns every loose .md in the tree into
  # a public page -- README.md, CLAUDE.md and anything under docs/ would all be
  # published. This bit the hub repo, where NEXT.md became _site/NEXT.html
  # before it was noticed. Do not widen this list to include ".md".
  #
  # NOTE: there is deliberately NO release allowlist here, unlike the course
  # template this repository was created from. A course holds sessions back
  # until the week they are taught; this is a public reference site with
  # nothing to hold back, so an allowlist would be ceremony that goes stale.
  render:
    - "index.qmd"
    - "parts/*.qmd"

    # Belt and braces. The list above already excludes these; saying so
    # explicitly gives check-output.sh something to assert against.
    - "!instructor/**"
    - "!shared/partials/**"

  # Copied verbatim into the output. MUST stay outside the render list above:
  # putting it in the middle silently turns every following entry into a
  # resource, so pages are copied as raw .qmd instead of being rendered.
  #
  # 404.html has to exist at the top level or Cloudflare Pages treats the
  # deployment as a single-page application and serves / for every unmatched
  # path -- returning the home page, with status 200, for a URL that is wrong.
  #
  # The leading slash anchors this to the project root. A bare "404.html" is a
  # recursive glob: it matched a jupyter template inside .pixi/ and dragged
  # part of the environment into the build.
  resources:
    - "/404.html"

lang: en

website:
  title: "Linux Crash Course"
  description: >-
    The command line, package management and Git — the working baseline for
    computational practicals. Open teaching material.
  site-url: "https://linux.hoelzer.science"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: parts/01-command-line.qmd
        text: "1 — Command line"
      - href: parts/02-packages.qmd
        text: "2 — Tools"
      - href: parts/03-git.qmd
        text: "3 — Git"
      - href: parts/04-file-formats.qmd
        text: "4 — File formats"
  page-footer:
    center: >-
      Content licensed
      [CC BY-SA 4.0](https://creativecommons.org/licenses/by-sa/4.0/) ·
      code MIT.

format:
  html:
    theme:
      - cosmo
      - styles/website.scss
    toc: true
    # These pages are long by design -- a reference you scroll and search, not
    # a lecture you read once. Depth 3 keeps every named command reachable
    # from the sidebar.
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
