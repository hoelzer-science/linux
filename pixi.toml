[workspace]
name = "linux-crash-course"
description = "Build and test environment for the Linux crash course site"
channels = ["conda-forge"]
# No bioconda: nothing here is a bioinformatics tool. This environment builds
# and tests the SITE -- readers do not need it.
#
# win-64 is deliberately absent. Not because anything fails to solve without
# it, but because the material's answer for Windows is WSL2, which is linux-64.
# Offering a native Windows environment here would contradict the advice.
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = "3.12.*"

[feature.dev.dependencies]
pytest = "*"
ruff = "*"

[environments]
default = { features = ["dev"] }

[tasks]
# Every shell example on the site is extracted from the .qmd sources and run
# in a scratch directory. This is the whole reason the repo has an environment
# at all: a command in a code block either works or it does not, and this is
# the most testable material the teaching project has produced.
test = "pytest tests -v"
lint = "ruff check ."

site = "quarto render"
preview = "quarto preview"

# Render first (`pixi run site`).
check-links = "./scripts/check-links.sh _site"
check-output = "./scripts/check-output.sh _site"
check = { depends-on = ["check-links", "check-output"] }
